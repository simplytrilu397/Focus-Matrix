# Google Cloud Build configuration for FocusMatrix
# Builds the Docker container and deploys directly to Google Cloud Run

steps:
  # Step 1: Build the container image using Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/focusmatrix-app:$COMMIT_SHA', '.']

  # Step 2: Push the container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/focusmatrix-app:$COMMIT_SHA']

  # Step 3: Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'focusmatrix'
      - '--image'
      - 'gcr.io/$PROJECT_ID/focusmatrix-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/focusmatrix-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
